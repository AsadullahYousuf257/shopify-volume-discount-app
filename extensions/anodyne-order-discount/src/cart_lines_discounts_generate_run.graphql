query CartInput {
  localization {
    language {
      isoCode
    }
  }
  enteredDiscountCodes {
    code
    rejectable
  }

  cart {
      
    discount_code: attribute(key: "entered_discount_code") {
      value
    }
    discount_site: attribute(key: "site_id") {
      value
    }

  lines {
    id
    quantity
    cost {
      totalAmount {
        amount
      }
    amountPerQuantity {
      amount
    }
      compareAtAmountPerQuantity {
        amount
      }
    }
    merchandise {
      __typename

      ... on ProductVariant {
        product {
            tags: hasTags(tags: ["free_bag", "free_book", "book", "posture shirt", "Alennus"]) {
              tag
              hasTag
            }
          alennusPercentage: metafield(namespace: "custom", key: "alennus_percentage") {
            value
          }
          alennusPercentageThree: metafield(namespace: "custom", key: "alennus_percentage_three") {
            value
          }
        }
      }
    }
  }
}

  discount {
    discountClasses
  }
}